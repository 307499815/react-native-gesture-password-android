buildscript {
    ext {
        kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '1.6.21'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 28)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 28)
    }

    // JVM target is intentionally owned by the consuming app's Android toolchain.
    // Keeping it unset allows both legacy Java 8 hosts and modern Java 17 hosts.
    lintOptions {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

def rnAndroidDir = rootProject.projectDir.parentFile?.path + '/node_modules/react-native/android'

repositories {
    google()
    mavenCentral()
    if (file(rnAndroidDir).exists()) {
        maven { url rnAndroidDir }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"

    // React Native 由宿主项目提供
    compileOnly 'com.facebook.react:react-native:+'

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
